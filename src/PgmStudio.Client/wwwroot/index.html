<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGM Studio</title>
    <base href="/" />
    <!-- Theme: set data-theme before any CSS loads so there is no dark→light flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pgm-theme");
          if (t !== "light" && t !== "dark")
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
        try {
          var s = localStorage.getItem("pgm-text-size");
          if (s === "small" || s === "large" || s === "larger")
            document.documentElement.setAttribute("data-text-size", s);
        } catch (e) { /* private mode: the default size */ }
      })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Studio design system (ported verbatim from pgm-map-studio): tokens → components → editor. -->
    <link rel="stylesheet" href="css/studio/tokens.css" />
    <link rel="stylesheet" href="css/studio/components.css" />
    <link rel="stylesheet" href="css/studio/editor.css" />
    <link rel="stylesheet" href="css/studio/generator.css" />
    <link rel="stylesheet" href="css/studio/library.css" />
    <link rel="stylesheet" href="css/studio/catalog.css" />
    <link rel="stylesheet" href="css/studio/style-library.css" />
    <link rel="stylesheet" href="css/studio/design.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script type="importmap"></script>
    <script src="js/studio/vendor/lucide-icons.js"></script>
    <script src="js/studio.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
